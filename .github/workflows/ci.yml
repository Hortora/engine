name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-jvm:
    name: JVM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven for casehub packages
        env:
          PACKAGES_TOKEN: ${{ secrets.CASEHUB_PACKAGES_TOKEN }}
        run: |
          mkdir -p ~/.m2
          printf '<settings>\n  <servers>\n    <server>\n      <id>github-casehubio</id>\n      <username>%s</username>\n      <password>%s</password>\n    </server>\n  </servers>\n</settings>\n' "${{ github.actor }}" "$PACKAGES_TOKEN" > ~/.m2/settings.xml

      - name: Build and test (JVM)
        run: ./mvnw verify -B
