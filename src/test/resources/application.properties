hortora.garden.path=src/test/resources/fixtures

quarkus.http.test-port=0
casehub.rag.qdrant.host=localhost
casehub.rag.qdrant.port=6334
casehub.rag.tenancy-strategy=SEPARATE_COLLECTIONS

# Index casehub-rag-testing for CDI bean discovery
quarkus.index-dependency.casehub-rag-testing.group-id=io.casehub
quarkus.index-dependency.casehub-rag-testing.artifact-id=casehub-neocortex-rag-testing

# Index rag-expansion for CDI bean discovery in tests
quarkus.index-dependency.casehub-rag-expansion.group-id=io.casehub
quarkus.index-dependency.casehub-rag-expansion.artifact-id=casehub-neocortex-rag-expansion

# Index rag-tracking for CDI bean discovery in tests
quarkus.index-dependency.casehub-rag-tracking.group-id=io.casehub
quarkus.index-dependency.casehub-rag-tracking.artifact-id=casehub-neocortex-rag-tracking

# Retrieval tracking — InMemoryRetrievalTracker overrides SqliteRetrievalTracker via @Alternative
casehub.rag.tracking.enabled=true
casehub.rag.tracking.sqlite.path=:memory:

# Disable inverted HyDE in tests — no Ollama available
hortora.inverted-hyde.enabled=false

# CBR outcome tracking — H2 in-memory for tests
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:cbr-test
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=drop-and-create

# Index memory-cbr-jpa and memory-cbr-inmem for CDI bean discovery in tests
quarkus.index-dependency.casehub-memory-cbr-jpa.group-id=io.casehub
quarkus.index-dependency.casehub-memory-cbr-jpa.artifact-id=casehub-neocortex-memory-cbr-jpa
quarkus.index-dependency.casehub-memory-cbr-inmem.group-id=io.casehub
quarkus.index-dependency.casehub-memory-cbr-inmem.artifact-id=casehub-neocortex-memory-cbr-inmem
