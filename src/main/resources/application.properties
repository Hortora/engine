# Suppress SmallRye unknown-property validation — casehub-neocortex-rag-tracking uses @ConfigProperty
# under the casehub.rag.* prefix owned by RagConfig's @ConfigMapping. Fix belongs in neocortex.
smallrye.config.mapping.validate-unknown=false

casehub.rag.qdrant.host=localhost
casehub.rag.qdrant.port=6334
casehub.rag.tenancy-strategy=SEPARATE_COLLECTIONS
casehub.rag.ingestion.corpora.garden.chunking=recursive
casehub.rag.ingestion.corpora.garden.chunking-max-size=6000
casehub.rag.ingestion.corpora.garden.chunking-overlap-size=500
casehub.rag.ingestion.corpora.garden.tenant-id=hortora
casehub.rag.ingestion.corpora.garden.corpus-name=garden

# Index rag-expansion + platform agent for CDI bean discovery
quarkus.index-dependency.casehub-rag-expansion.group-id=io.casehub
quarkus.index-dependency.casehub-rag-expansion.artifact-id=casehub-neocortex-rag-expansion
quarkus.index-dependency.casehub-platform-agent-langchain4j.group-id=io.casehub
quarkus.index-dependency.casehub-platform-agent-langchain4j.artifact-id=casehub-platform-agent-langchain4j
quarkus.index-dependency.casehub-platform-agent-claude.group-id=io.casehub
quarkus.index-dependency.casehub-platform-agent-claude.artifact-id=casehub-platform-agent-claude
quarkus.index-dependency.casehub-platform.group-id=io.casehub
quarkus.index-dependency.casehub-platform.artifact-id=casehub-platform
quarkus.index-dependency.casehub-rag-crossencoder.group-id=io.casehub
quarkus.index-dependency.casehub-rag-crossencoder.artifact-id=casehub-neocortex-rag-crossencoder
quarkus.index-dependency.casehub-rag-tracking.group-id=io.casehub
quarkus.index-dependency.casehub-rag-tracking.artifact-id=casehub-neocortex-rag-tracking

# BGE-M3 ONNX model (dev mode — run scripts/export_bge_m3.py first, see scripts/download-models.sh)
%dev.casehub.inference.models.bge-m3.model-path=${user.home}/.hortora/models/bge-m3/model.onnx
%dev.casehub.inference.models.bge-m3.tokenizer-path=${user.home}/.hortora/models/bge-m3/tokenizer.json
%dev.casehub.inference.models.bge-m3.max-sequence-length=768
%dev.casehub.rag.embedding-batch-size=25
casehub.rag.retrieval.rerank-top-n=50

# Cross-encoder reranking via ONNX model
%dev.casehub.inference.models.reranker.model-path=${user.home}/.hortora/models/reranker/model.onnx
%dev.casehub.inference.models.reranker.tokenizer-path=${user.home}/.hortora/models/reranker/tokenizer.json
%dev.casehub.inference.models.reranker.max-sequence-length=512
casehub.rag.reranking.enabled=true
casehub.rag.reranking.rerank-pool-size=50

# Adaptive CE score filtering
# Retrieval frequency tracking — SQLite-backed, records every CaseRetriever.retrieve() call
casehub.rag.tracking.enabled=true
casehub.rag.tracking.sqlite.path=${hortora.garden.path}/../stats/retrieval-tracking.db
casehub.rag.tracking.retention.days=180

# Cursor must persist across reboots — default tmpdir gets cleaned
casehub.rag.ingestion.cursor-dir=${hortora.garden.path}/../cursors

hortora.search.score-floor=0.0
hortora.search.gap-threshold=2.0
hortora.search.min-results=3
hortora.search.score-boost-weight=0.0

# Inverted HyDE — index-time query generation via local Ollama
# DISABLED — benchmarked at -2.5pp vs baseline. Same finding as query-time HyDE:
# expansion (any form) hurts this corpus's strong five-signal retriever.
hortora.inverted-hyde.enabled=false
hortora.inverted-hyde.ollama.host=http://localhost:11434
hortora.inverted-hyde.ollama.model=gemma3:4b
hortora.inverted-hyde.query-count=3

# Claude agent — Vertex AI auth from env vars
# Required env: ANTHROPIC_VERTEX_PROJECT_ID, CLOUD_ML_REGION, CLAUDE_CODE_USE_VERTEX
casehub.platform.agent.claude.default-timeout=PT3M
%dev.casehub.platform.agent.claude.max-concurrent-sessions=2

# Provenance tracking — SQLite
%test.hortora.garden.provenance.sqlite-path=:memory:

# CBR outcome tracking — H2 file-persistent (default datasource, no named qualifier)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:${hortora.data.path:${user.home}/.hortora}/stats/cbr
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.packages=io.casehub.neocortex.memory.cbr.jpa
quarkus.hibernate-orm.database.generation=update

# Index memory-cbr-jpa for CDI bean discovery
quarkus.index-dependency.casehub-memory-cbr-jpa.group-id=io.casehub
quarkus.index-dependency.casehub-memory-cbr-jpa.artifact-id=casehub-neocortex-memory-cbr-jpa
